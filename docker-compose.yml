services:
  docmost:
    image: docmost-local:dev
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    depends_on:
      - db
      - redis
    environment:
      APP_URL: "${APP_URL:-http://localhost:3000}"
      APP_SECRET: "${APP_SECRET:-REPLACE_WITH_LONG_SECRET}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      EMBED_ALLOWED_ORIGINS: "${EMBED_ALLOWED_ORIGINS:-}"
      AI_PROVIDER_ALLOWED_ORIGINS: "${AI_PROVIDER_ALLOWED_ORIGINS:-}"
      AI_RETRIEVAL_ALLOWED_ORIGINS: "${AI_RETRIEVAL_ALLOWED_ORIGINS:-}"
      AI_STREAM_IDLE_TIMEOUT_MS: "${AI_STREAM_IDLE_TIMEOUT_MS:-120000}"
      RAG_API_RATE_LIMIT_PER_MINUTE: "${RAG_API_RATE_LIMIT_PER_MINUTE:-120}"
      RAG_API_MAX_CONCURRENT: "${RAG_API_MAX_CONCURRENT:-8}"
      RAG_API_BULK_MAX_CONCURRENT: "${RAG_API_BULK_MAX_CONCURRENT:-2}"
      MCP_RATE_LIMIT_PER_MINUTE: "${MCP_RATE_LIMIT_PER_MINUTE:-60}"
      MCP_MAX_CONCURRENT: "${MCP_MAX_CONCURRENT:-4}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://docmost:${POSTGRES_PASSWORD:-STRONG_DB_PASSWORD}@db:5432/docmost}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-}"
      AUTH_RATE_LIMIT_STORAGE: "${AUTH_RATE_LIMIT_STORAGE:-redis}"
      DISABLE_TELEMETRY: true
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-STRONG_DB_PASSWORD}"
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
