services:
  docmost:
    image: docmost-local:dev
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    depends_on:
      - db
      - redis
    environment:
      APP_URL: "${APP_URL:-http://localhost:3000}"
      APP_SECRET: "${APP_SECRET:-REPLACE_WITH_LONG_SECRET}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      EMBED_ALLOWED_ORIGINS: "${EMBED_ALLOWED_ORIGINS:-}"
      AI_PROVIDER_ALLOWED_ORIGINS: "${AI_PROVIDER_ALLOWED_ORIGINS:-}"
      AI_RETRIEVAL_ALLOWED_ORIGINS: "${AI_RETRIEVAL_ALLOWED_ORIGINS:-}"
      AI_ASSISTANT_PROFILES_ENABLED: "${AI_ASSISTANT_PROFILES_ENABLED:-false}"
      AI_BUILTIN_TOOL_EXTENSIONS_ENABLED: "${AI_BUILTIN_TOOL_EXTENSIONS_ENABLED:-false}"
      AI_EXTERNAL_MCP_ENABLED: "${AI_EXTERNAL_MCP_ENABLED:-false}"
      AI_MCP_ALLOWED_ORIGINS: "${AI_MCP_ALLOWED_ORIGINS:-}"
      AI_STREAM_IDLE_TIMEOUT_MS: "${AI_STREAM_IDLE_TIMEOUT_MS:-120000}"
      PAGE_TEMPLATES_ENABLED: "${PAGE_TEMPLATES_ENABLED:-false}"
      RAG_API_RATE_LIMIT_PER_MINUTE: "${RAG_API_RATE_LIMIT_PER_MINUTE:-120}"
      RAG_API_MAX_CONCURRENT: "${RAG_API_MAX_CONCURRENT:-8}"
      RAG_API_BULK_MAX_CONCURRENT: "${RAG_API_BULK_MAX_CONCURRENT:-2}"
      MCP_RATE_LIMIT_PER_MINUTE: "${MCP_RATE_LIMIT_PER_MINUTE:-60}"
      MCP_MAX_CONCURRENT: "${MCP_MAX_CONCURRENT:-4}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://docmost:${POSTGRES_PASSWORD:-STRONG_DB_PASSWORD}@db:5432/docmost}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-}"
      AUTH_RATE_LIMIT_STORAGE: "${AUTH_RATE_LIMIT_STORAGE:-redis}"
      DISABLE_TELEMETRY: true
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-STRONG_DB_PASSWORD}"
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  rag-sync:
    profiles: ["rag-sync"]
    image: docmost-rag-sync-local:dev
    build:
      context: .
      dockerfile: Dockerfile.rag-sync
    pull_policy: never
    restart: unless-stopped
    environment:
      RAG_SYNC_REDIS_URL: "${RAG_SYNC_REDIS_URL:-redis://redis:6379/1}"
      RAG_SYNC_REDIS_PREFIX: "${RAG_SYNC_REDIS_PREFIX:-docmost:rag-sync}"
      RAG_SYNC_POLL_INTERVAL_MS: "${RAG_SYNC_POLL_INTERVAL_MS:-60000}"
      RAG_SYNC_REQUEST_TIMEOUT_MS: "${RAG_SYNC_REQUEST_TIMEOUT_MS:-30000}"
      RAG_SYNC_PROCESSING_TIMEOUT_MS: "${RAG_SYNC_PROCESSING_TIMEOUT_MS:-600000}"
      RAG_SYNC_MAX_ATTACHMENT_BYTES: "${RAG_SYNC_MAX_ATTACHMENT_BYTES:-26214400}"
      RAG_SYNC_BINDING_ID: "${RAG_SYNC_BINDING_ID:-}"
      RAG_SYNC_WORKSPACE_ID: "${RAG_SYNC_WORKSPACE_ID:-}"
      RAG_SYNC_SPACE_ID: "${RAG_SYNC_SPACE_ID:-}"
      RAG_SYNC_DOCMOST_BASE_URL: "${RAG_SYNC_DOCMOST_BASE_URL:-http://docmost:3000}"
      RAG_SYNC_DOCMOST_API_KEY: "${RAG_SYNC_DOCMOST_API_KEY:-}"
      RAG_SYNC_OPEN_WEBUI_BASE_URL: "${RAG_SYNC_OPEN_WEBUI_BASE_URL:-}"
      RAG_SYNC_OPEN_WEBUI_API_KEY: "${RAG_SYNC_OPEN_WEBUI_API_KEY:-}"
      RAG_SYNC_KNOWLEDGE_ID: "${RAG_SYNC_KNOWLEDGE_ID:-}"
    depends_on:
      docmost:
        condition: service_started
      redis:
        condition: service_started

volumes:
  docmost:
  db_data:
  redis_data:
