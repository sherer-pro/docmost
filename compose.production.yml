name: "${COMPOSE_PROJECT_NAME:-docmost}"

x-docmost-environment: &docmost-environment
  NODE_ENV: production
  APP_URL: "${APP_URL:?Set APP_URL to the public HTTPS origin}"
  APP_SECRET_FILE: /run/secrets/docmost_app_secret
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:?Set TRUSTED_PROXIES to the controlled ingress addresses}"
  EMBED_ALLOWED_ORIGINS: "${EMBED_ALLOWED_ORIGINS:-}"
  AI_PROVIDER_ALLOWED_ORIGINS: "${AI_PROVIDER_ALLOWED_ORIGINS:-}"
  AI_RETRIEVAL_ALLOWED_ORIGINS: "${AI_RETRIEVAL_ALLOWED_ORIGINS:-}"
  AI_ASSISTANT_PROFILES_ENABLED: "${AI_ASSISTANT_PROFILES_ENABLED:-false}"
  AI_BUILTIN_TOOL_EXTENSIONS_ENABLED: "${AI_BUILTIN_TOOL_EXTENSIONS_ENABLED:-false}"
  AI_EXTERNAL_MCP_ENABLED: "${AI_EXTERNAL_MCP_ENABLED:-false}"
  AI_MCP_ALLOWED_ORIGINS: "${AI_MCP_ALLOWED_ORIGINS:-}"
  AI_STREAM_IDLE_TIMEOUT_MS: "${AI_STREAM_IDLE_TIMEOUT_MS:-120000}"
  PAGE_TEMPLATES_ENABLED: "${PAGE_TEMPLATES_ENABLED:-false}"
  SSO_ALLOWED_ENDPOINTS: "${SSO_ALLOWED_ENDPOINTS:-}"
  RAG_API_RATE_LIMIT_PER_MINUTE: "${RAG_API_RATE_LIMIT_PER_MINUTE:-120}"
  RAG_API_MAX_CONCURRENT: "${RAG_API_MAX_CONCURRENT:-8}"
  RAG_API_BULK_MAX_CONCURRENT: "${RAG_API_BULK_MAX_CONCURRENT:-2}"
  RAG_SYNC_ENABLED: "${RAG_SYNC_ENABLED:-false}"
  RAG_SYNC_ALLOWED_ORIGINS: "${RAG_SYNC_ALLOWED_ORIGINS:-}"
  RAG_SYNC_REDIS_PREFIX: "${RAG_SYNC_REDIS_PREFIX:-docmost:rag-sync}"
  RAG_SYNC_POLL_INTERVAL_MS: "${RAG_SYNC_POLL_INTERVAL_MS:-60000}"
  RAG_SYNC_DISCOVERY_INTERVAL_MS: "${RAG_SYNC_DISCOVERY_INTERVAL_MS:-30000}"
  RAG_SYNC_MAX_CONCURRENT_BINDINGS: "${RAG_SYNC_MAX_CONCURRENT_BINDINGS:-4}"
  RAG_SYNC_MAX_CONCURRENT_DOCUMENTS: "${RAG_SYNC_MAX_CONCURRENT_DOCUMENTS:-4}"
  RAG_SYNC_REQUEST_TIMEOUT_MS: "${RAG_SYNC_REQUEST_TIMEOUT_MS:-30000}"
  RAG_SYNC_PROCESSING_TIMEOUT_MS: "${RAG_SYNC_PROCESSING_TIMEOUT_MS:-600000}"
  RAG_SYNC_MAX_ATTACHMENT_BYTES: "${RAG_SYNC_MAX_ATTACHMENT_BYTES:-26214400}"
  RAG_SYNC_RECONCILE_INTERVAL_MS: "${RAG_SYNC_RECONCILE_INTERVAL_MS:-21600000}"
  RAG_SYNC_SHUTDOWN_TIMEOUT_MS: "${RAG_SYNC_SHUTDOWN_TIMEOUT_MS:-30000}"
  MCP_RATE_LIMIT_PER_MINUTE: "${MCP_RATE_LIMIT_PER_MINUTE:-60}"
  MCP_MAX_CONCURRENT: "${MCP_MAX_CONCURRENT:-4}"
  DATABASE_URL_FILE: /run/secrets/docmost_database_url
  DATABASE_MAX_POOL: "${DATABASE_MAX_POOL:-10}"
  DATABASE_MIGRATION_MODE: external
  REDIS_URL_FILE: /run/secrets/docmost_redis_url
  JWT_TOKEN_EXPIRES_IN: "${JWT_TOKEN_EXPIRES_IN:-30d}"
  COLLAB_URL: "${COLLAB_URL:?Set COLLAB_URL to the public collaboration origin}"
  COLLAB_INTERNAL_URL: http://collab:3001
  COLLAB_INTERNAL_SECRET_FILE: /run/secrets/docmost_collab_internal_secret
  COLLAB_PORT: "${COLLAB_PORT:-3001}"
  COLLAB_DISABLE_REDIS: "${COLLAB_DISABLE_REDIS:-false}"
  COLLAB_SHOW_STATS: "${COLLAB_SHOW_STATS:-false}"
  AUTH_RATE_LIMIT_STORAGE: redis
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  FILE_UPLOAD_SIZE_LIMIT: "${FILE_UPLOAD_SIZE_LIMIT:-50mb}"
  FILE_IMPORT_SIZE_LIMIT: "${FILE_IMPORT_SIZE_LIMIT:-200mb}"
  AWS_S3_ACCESS_KEY_ID: "${AWS_S3_ACCESS_KEY_ID:-}"
  AWS_S3_REGION: "${AWS_S3_REGION:-}"
  AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
  AWS_S3_ENDPOINT: "${AWS_S3_ENDPOINT:-}"
  AWS_S3_FORCE_PATH_STYLE: "${AWS_S3_FORCE_PATH_STYLE:-false}"
  AWS_S3_URL: "${AWS_S3_URL:-}"
  MAIL_DRIVER: "${MAIL_DRIVER:-log}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Docmost}"
  SMTP_HOST: "${SMTP_HOST:-127.0.0.1}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  SMTP_IGNORETLS: "${SMTP_IGNORETLS:-false}"
  WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
  WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-}"
  DRAWIO_URL: "${DRAWIO_URL:?Set DRAWIO_URL to an approved absolute HTTPS URL}"
  CLOUD: "${CLOUD:-false}"
  SUBDOMAIN_HOST: "${SUBDOMAIN_HOST:-}"
  SEARCH_DRIVER: "${SEARCH_DRIVER:-database}"
  TYPESENSE_URL: "${TYPESENSE_URL:-http://localhost:8108}"
  TYPESENSE_LOCALE: "${TYPESENSE_LOCALE:-en}"
  PDF_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  PDF_RENDER_TIMEOUT_MS: "${PDF_RENDER_TIMEOUT_MS:-60000}"
  DEBUG_MODE: "${DEBUG_MODE:-false}"
  DEBUG_DB: "${DEBUG_DB:-false}"
  LOG_HTTP: "${LOG_HTTP:-false}"

x-docmost-secrets: &docmost-secrets
  - docmost_app_secret
  - docmost_collab_internal_secret
  - docmost_database_url
  - docmost_redis_url

x-app-image: &app-image
  image: "${DOCMOST_IMAGE:?Set DOCMOST_IMAGE to image@sha256:digest}"
  pull_policy: always

services:
  image-preflight:
    <<: *app-image
    command:
      - node
      - apps/server/dist/apps/server/src/database/production-image-preflight.js
    environment:
      DOCMOST_IMAGE_REF: "${DOCMOST_IMAGE:?Set DOCMOST_IMAGE to image@sha256:digest}"
    restart: "no"

  db:
    # Оператор миграции временно возвращает сюда точный прежний image при rollback.
    # Дефолт остаётся каноническим PostgreSQL 18, поэтому обычный deploy не зависит
    # от state-файла, а физический том PostgreSQL 16 никогда не открывается версией 18.
    image: "${POSTGRES_IMAGE:-postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-docmost}"
      POSTGRES_USER: "${POSTGRES_USER:-docmost}"
      POSTGRES_PASSWORD_FILE: /run/secrets/docmost_postgres_password
    secrets:
      - docmost_postgres_password
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test "$$(cat /proc/1/comm)" = postgres && pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data

  db-preflight:
    <<: *app-image
    command:
      - node
      - apps/server/dist/apps/server/src/database/preflight.js
    environment:
      DATABASE_URL_FILE: /run/secrets/docmost_database_url
      POSTGRES_EXPECTED_MAJOR: "18"
      POSTGRES_EXPECTED_RUNTIME: linux-gnu
    secrets:
      - docmost_database_url
    depends_on:
      image-preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"

  db-migrate:
    <<: *app-image
    command:
      - node
      - apps/server/dist/apps/server/src/database/migrate-latest.js
    environment:
      DATABASE_URL_FILE: /run/secrets/docmost_database_url
      APP_SECRET_FILE: /run/secrets/docmost_app_secret
    secrets:
      - docmost_database_url
      - docmost_app_secret
    depends_on:
      db-preflight:
        condition: service_completed_successfully
    restart: "no"

  collab:
    <<: *app-image
    command:
      - node
      - apps/server/dist/apps/server/src/collaboration/server/collab-main.js
    environment: *docmost-environment
    secrets: *docmost-secrets
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${DOCMOST_BIND_ADDRESS:-127.0.0.1}:${COLLAB_PORT:-3001}:${COLLAB_PORT:-3001}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:$${COLLAB_PORT:-3001}/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - edge
    volumes:
      - docmost_storage:/app/data/storage

  docmost:
    <<: *app-image
    environment: *docmost-environment
    secrets: *docmost-secrets
    depends_on:
      collab:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${DOCMOST_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - edge
    volumes:
      - docmost_storage:/app/data/storage

volumes:
  db_data:
    external: true
    name: "${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME in the deployment state file}"
  docmost_storage:
    external: true
    name: "${DOCMOST_STORAGE_VOLUME_NAME:?Set DOCMOST_STORAGE_VOLUME_NAME in the deployment state file}"
  redis_data:

networks:
  edge:
    name: "${EDGE_NETWORK_NAME:?Set EDGE_NETWORK_NAME to the production ingress network}"
    external: true

secrets:
  docmost_app_secret:
    environment: APP_SECRET
  docmost_collab_internal_secret:
    environment: COLLAB_INTERNAL_SECRET
  docmost_database_url:
    environment: DATABASE_URL
  docmost_redis_url:
    environment: REDIS_URL
  docmost_postgres_password:
    environment: POSTGRES_PASSWORD
