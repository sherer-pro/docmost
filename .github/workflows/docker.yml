name: Docker Build and Push

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gates:
    name: Required release gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified image
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the release image
        run: docker build --build-arg PNPM_OFFLINE=0 -t shererpro/docmost:${VERSION} .

      - name: Push the immutable version first
        run: docker push shererpro/docmost:${VERSION}

      - name: Publish latest after the versioned push succeeds
        if: github.event_name == 'release'
        run: |
          docker tag shererpro/docmost:${VERSION} shererpro/docmost:latest
          docker push shererpro/docmost:latest
