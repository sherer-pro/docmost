name: Docker Build and Push

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Required release gates
    uses: ./.github/workflows/ci.yml

  candidate:
    name: Build deployment candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      version: ${{ steps.image.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./package.json').version")"
          test -n "$manifest_version"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            expected_tag="v${manifest_version}"
            test "$tag" = "$expected_tag"
            version="$manifest_version"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the release image
        run: docker build --build-arg PNPM_OFFLINE=0 --build-arg "BUILD_VERSION=${VERSION}" --build-arg "BUILD_REVISION=${GITHUB_SHA}" -t "shererpro/docmost:candidate-${VERSION}-${GITHUB_SHA}" .

      - name: Record the candidate digest
        id: image
        shell: bash
        run: |
          candidate="shererpro/docmost:candidate-${VERSION}-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$candidate")" = "$VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$candidate")" = "$GITHUB_SHA"
          docker push "$candidate"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$candidate")"
          [[ "$image" =~ ^shererpro/docmost@sha256:[0-9a-f]{64}$ ]]
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate for \`$GITHUB_SHA\`: \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified image
    needs: [gates, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: shererpro/docmost@${{ needs.candidate.outputs.digest }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the immutable version first
        run: |
          [[ "$IMAGE" =~ ^shererpro/docmost@sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --prefer-index=false --tag "shererpro/docmost:${VERSION}" "$IMAGE"

      - name: Publish latest after the versioned push succeeds
        if: github.event_name == 'release'
        run: docker buildx imagetools create --prefer-index=false --tag shererpro/docmost:latest "$IMAGE"
