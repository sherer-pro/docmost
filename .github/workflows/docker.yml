name: Docker Build and Push

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gates:
    name: Required release gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified image
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the release images
        run: |
          docker build --build-arg PNPM_OFFLINE=0 -t shererpro/docmost:${VERSION} .
          docker build -f Dockerfile.rag-sync -t shererpro/docmost:rag-sync-${VERSION} .

      - name: Push the immutable versions first
        run: |
          docker push shererpro/docmost:${VERSION}
          docker push shererpro/docmost:rag-sync-${VERSION}

      - name: Publish latest only after both versioned pushes succeed
        if: github.event_name == 'release'
        run: |
          docker tag shererpro/docmost:${VERSION} shererpro/docmost:latest
          docker tag shererpro/docmost:rag-sync-${VERSION} shererpro/docmost:rag-sync-latest
          docker push shererpro/docmost:latest
          docker push shererpro/docmost:rag-sync-latest
