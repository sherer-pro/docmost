name: Open WebUI RAG compatibility

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-open-webui-compatibility
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run pinned Open WebUI compatibility suite
        env:
          CI_LOG_CANARIES: "isolated-rag-audit-secret-at-least-32-characters;docmost-test-password;isolated-open-webui-test-secret;Open-WebUI-compat-password-123!"
        run: node scripts/run-rag-open-webui-compat.mjs

      - name: Capture Open WebUI logs
        if: failure()
        env:
          CI_LOG_CANARIES: "isolated-rag-audit-secret-at-least-32-characters;docmost-test-password;isolated-open-webui-test-secret;Open-WebUI-compat-password-123!"
        run: |
          mkdir -p output/audit
          { docker compose -f tests/rag-sync/compose.yml --profile real-open-webui logs --no-color open-webui 2>&1 || true; } |
            node scripts/sanitize-ci-log-stream.mjs > output/audit/open-webui.log
          node scripts/scan-ci-artifacts.mjs output/audit
          touch output/audit/.sanitized

      - name: Upload compatibility artifacts
        if: failure() && hashFiles('output/audit/.sanitized') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-open-webui-compatibility
          path: output/audit
          if-no-files-found: ignore
          retention-days: 7
