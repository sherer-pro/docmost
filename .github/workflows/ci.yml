name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Community-edition boundary check
        run: |
          pnpm check:no-ee
          pnpm test:no-ee

      - name: Blocking architecture and release gate contracts
        run: |
          pnpm check:architecture
          pnpm check:release-gates

      - name: Build
        run: pnpm build

      - name: API route inventory drift check
        run: pnpm routes:inventory:check

      - name: RAG documentation contract check
        run: pnpm check:rag-docs

      - name: AI documentation contract check
        run: pnpm check:ai-docs

      - name: Cross-platform text contract check
        run: pnpm test:text-contracts

      - name: Environment contract check
        run: pnpm check:env

      - name: Lint
        run: pnpm lint

      - name: Client tests
        run: pnpm --filter ./apps/client test

      - name: Server tests
        run: pnpm --filter ./apps/server test

      - name: RAG Sync fixture contract
        run: pnpm test:rag-sync:contract

      - name: Security regression tests
        run: pnpm test:security

      - name: Comment language check
        run: pnpm check:comments:en

      - name: Production audit (fail on high/critical)
        run: |
          pnpm check:audit-exceptions
          pnpm audit --prod --audit-level high

  integration:
    name: PostgreSQL, Redis, migrations, and server E2E
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: docmost
          POSTGRES_USER: docmost
          POSTGRES_PASSWORD: docmost-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmost -d docmost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: ci-only-app-secret-at-least-32-characters
      DATABASE_URL: postgresql://docmost:docmost-ci-password@127.0.0.1:5432/docmost
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_RATE_LIMIT_STORAGE: redis
      DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server and workspace packages
        run: pnpm server:build

      - name: Apply every migration to an empty PostgreSQL database
        run: pnpm --filter ./apps/server migration:latest

      - name: Server integration tests
        run: pnpm --filter ./apps/server test:e2e

  production-smoke:
    name: Production image, embedded RAG sync, MCP, and collaboration
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/client/e2e/ai-context/requirements.txt

      - name: Install smoke-test dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r apps/client/e2e/ai-context/requirements.txt
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build the production image once
        run: docker build --build-arg PNPM_OFFLINE=0 -t docmost:ci .

      - name: Start PostgreSQL, Redis, and mock Open WebUI
        run: |
          docker network create docmost-ci
          docker volume create docmost-ci-storage
          docker run -d --name docmost-db --network docmost-ci \
            -e POSTGRES_DB=docmost \
            -e POSTGRES_USER=docmost \
            -e POSTGRES_PASSWORD=docmost-ci-password \
            postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
          docker run -d --name docmost-redis --network docmost-ci \
            redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366 \
            redis-server --appendonly no --maxmemory-policy noeviction
          docker run -d --name docmost-open-webui --network docmost-ci -p 18080:8080 \
            -e MOCK_OPEN_WEBUI_PROCESSING_DELAY_MS=500 \
            -v "$PWD/scripts/ci-open-webui-mock.mjs:/mock.mjs:ro" \
            node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 node /mock.mjs
          for _ in $(seq 1 30); do
            if docker exec docmost-db pg_isready -U docmost -d docmost && \
               docker exec docmost-redis redis-cli ping | grep -q PONG && \
               curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run migrations from the built image
        run: |
          docker run --rm --network docmost-ci \
            -e DATABASE_URL=postgresql://docmost:docmost-ci-password@docmost-db:5432/docmost \
            -e APP_SECRET=ci-only-app-secret-at-least-32-characters \
            --entrypoint node docmost:ci \
            apps/server/dist/apps/server/src/database/migrate.js latest

      - name: Start API and collaboration processes from the same image
        run: |
          docker run -d --name docmost-app --network docmost-ci -p 3000:3000 \
            --add-host host.docker.internal:host-gateway \
            -v docmost-ci-storage:/app/data/storage \
            -e NODE_ENV=production \
            -e APP_URL=http://127.0.0.1:3000 \
            -e COLLAB_URL=http://127.0.0.1:3001 \
            -e APP_SECRET=ci-only-app-secret-at-least-32-characters \
            -e DATABASE_URL=postgresql://docmost:docmost-ci-password@docmost-db:5432/docmost \
            -e REDIS_URL=redis://docmost-redis:6379 \
            -e AUTH_RATE_LIMIT_STORAGE=redis \
            -e PAGE_TEMPLATES_ENABLED=true \
            -e AI_PROVIDER_ALLOWED_ORIGINS=http://host.docker.internal:1080 \
            -e AI_RETRIEVAL_ALLOWED_ORIGINS=http://host.docker.internal:1080 \
            -e RAG_SYNC_ENABLED=true \
            -e RAG_SYNC_ALLOWED_ORIGINS=http://docmost-open-webui:8080 \
            -e RAG_SYNC_REDIS_PREFIX=docmost:rag-sync-ci \
            -e RAG_SYNC_POLL_INTERVAL_MS=5000 \
            -e RAG_SYNC_DISCOVERY_INTERVAL_MS=5000 \
            -e RAG_SYNC_MAX_CONCURRENT_BINDINGS=2 \
            -e RAG_SYNC_MAX_CONCURRENT_DOCUMENTS=4 \
            -e RAG_SYNC_REQUEST_TIMEOUT_MS=5000 \
            -e RAG_SYNC_PROCESSING_TIMEOUT_MS=30000 \
            -e RAG_SYNC_RECONCILE_INTERVAL_MS=60000 \
            -e RAG_SYNC_SHUTDOWN_TIMEOUT_MS=5000 \
            -e DISABLE_TELEMETRY=true \
            docmost:ci
          docker run -d --name docmost-app-replica --network docmost-ci \
            --add-host host.docker.internal:host-gateway \
            -v docmost-ci-storage:/app/data/storage \
            -e NODE_ENV=production \
            -e APP_URL=http://127.0.0.1:3000 \
            -e COLLAB_URL=http://127.0.0.1:3001 \
            -e APP_SECRET=ci-only-app-secret-at-least-32-characters \
            -e DATABASE_URL=postgresql://docmost:docmost-ci-password@docmost-db:5432/docmost \
            -e REDIS_URL=redis://docmost-redis:6379 \
            -e AUTH_RATE_LIMIT_STORAGE=redis \
            -e PAGE_TEMPLATES_ENABLED=true \
            -e AI_PROVIDER_ALLOWED_ORIGINS=http://host.docker.internal:1080 \
            -e AI_RETRIEVAL_ALLOWED_ORIGINS=http://host.docker.internal:1080 \
            -e RAG_SYNC_ENABLED=true \
            -e RAG_SYNC_ALLOWED_ORIGINS=http://docmost-open-webui:8080 \
            -e RAG_SYNC_REDIS_PREFIX=docmost:rag-sync-ci \
            -e RAG_SYNC_POLL_INTERVAL_MS=5000 \
            -e RAG_SYNC_DISCOVERY_INTERVAL_MS=5000 \
            -e RAG_SYNC_MAX_CONCURRENT_BINDINGS=2 \
            -e RAG_SYNC_MAX_CONCURRENT_DOCUMENTS=4 \
            -e RAG_SYNC_REQUEST_TIMEOUT_MS=5000 \
            -e RAG_SYNC_PROCESSING_TIMEOUT_MS=30000 \
            -e RAG_SYNC_RECONCILE_INTERVAL_MS=60000 \
            -e RAG_SYNC_SHUTDOWN_TIMEOUT_MS=5000 \
            -e DISABLE_TELEMETRY=true \
            docmost:ci
          docker run -d --name docmost-collab --network docmost-ci -p 3001:3001 \
            -v docmost-ci-storage:/app/data/storage \
            -e NODE_ENV=production \
            -e APP_URL=http://127.0.0.1:3000 \
            -e COLLAB_URL=http://127.0.0.1:3001 \
            -e COLLAB_PORT=3001 \
            -e APP_SECRET=ci-only-app-secret-at-least-32-characters \
            -e DATABASE_URL=postgresql://docmost:docmost-ci-password@docmost-db:5432/docmost \
            -e REDIS_URL=redis://docmost-redis:6379 \
            -e AUTH_RATE_LIMIT_STORAGE=redis \
            -e DISABLE_TELEMETRY=true \
            --entrypoint node docmost:ci \
            apps/server/dist/apps/server/src/collaboration/server/collab-main.js

      - name: Wait for health checks
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null && \
               docker exec docmost-app-replica curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: MCP and collaboration E2E against production processes
        env:
          CI_SMOKE_BASE_URL: http://127.0.0.1:3000
          CI_SMOKE_COLLAB_URL: http://127.0.0.1:3001
        run: node scripts/ci-production-smoke.mjs

      - name: Editor browser acceptance against the production image
        env:
          DOCMOST_BASE_URL: http://127.0.0.1:3000
          DOCMOST_API_BASE_URL: http://127.0.0.1:3000
          DOCMOST_API_ORIGIN: http://127.0.0.1:3000
          DOCMOST_COLLAB_URL: http://127.0.0.1:3001
          DOCMOST_ADMIN_EMAIL: ci-admin@example.test
          DOCMOST_ADMIN_PASSWORD: CI-smoke-password-123!
        run: pnpm test:editor:e2e

      - name: AI browser acceptance against the production image
        env:
          DOCMOST_BASE_URL: http://127.0.0.1:3000
          DOCMOST_API_BASE_URL: http://127.0.0.1:3000
          DOCMOST_API_ORIGIN: http://127.0.0.1:3000
          DOCMOST_ADMIN_EMAIL: ci-admin@example.test
          DOCMOST_ADMIN_PASSWORD: CI-smoke-password-123!
          DOCMOST_CONTAINER_NAME: docmost-app
          DOCMOST_AI_PROVIDER_BASE_URL: http://host.docker.internal:1080/v1
        run: pnpm test:ai:e2e

      - name: AI context acceptance against the production image
        env:
          DOCMOST_BASE_URL: http://127.0.0.1:3000
          DOCMOST_API_BASE_URL: http://127.0.0.1:3000
          DOCMOST_API_ORIGIN: http://127.0.0.1:3000
          DOCMOST_ADMIN_EMAIL: ci-admin@example.test
          DOCMOST_ADMIN_PASSWORD: CI-smoke-password-123!
          DOCMOST_AI_CONTEXT_MODEL_PROVIDER_URL: http://host.docker.internal:1080/v1
          DOCMOST_AI_CONTEXT_RETRIEVAL_URL: http://host.docker.internal:1080/retrieval
          DOCMOST_AI_CONTEXT_COLLAB_URL: http://127.0.0.1:3001
        run: pnpm test:ai-context:e2e

      - name: Configure two embedded RAG sync bindings
        env:
          CI_SMOKE_BASE_URL: http://127.0.0.1:3000
          CI_RAG_SYNC_MOCK_URL: http://127.0.0.1:18080
          CI_RAG_SYNC_WRITER_URL: http://docmost-open-webui:8080
          CI_RAG_SYNC_STATE_PATH: ${{ runner.temp }}/docmost-rag-sync-smoke-state.json
        run: node scripts/ci-embedded-rag-sync-smoke.mjs prepare

      - name: Verify RAG sync PostgreSQL invariants
        run: |
          docker exec -i docmost-db psql -U docmost -d docmost \
            < scripts/ci-rag-sync-db-invariants.sql

      - name: Restart both API replicas during the initial RAG import
        run: |
          docker restart --timeout 5 docmost-app docmost-app-replica
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               docker exec docmost-app-replica curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify RAG resume, key isolation, and cleanup
        env:
          CI_SMOKE_BASE_URL: http://127.0.0.1:3000
          CI_RAG_SYNC_MOCK_URL: http://127.0.0.1:18080
          CI_RAG_SYNC_WRITER_URL: http://docmost-open-webui:8080
          CI_RAG_SYNC_STATE_PATH: ${{ runner.temp }}/docmost-rag-sync-smoke-state.json
        run: node scripts/ci-embedded-rag-sync-smoke.mjs resume

      - name: Verify the embedded runtime image and Redis namespace
        run: |
          docker run --rm --entrypoint sh docmost:ci -c \
            'test ! -e /app/apps/rag-sync && test ! -e /app/Dockerfile.rag-sync'
          test "$(docker exec docmost-redis redis-cli --scan --pattern 'docmost:rag-sync-ci:v2:*' | wc -l)" -gt 0
          if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' docmost-app | \
             grep -Eq '^RAG_SYNC_(CONFIG_PATH|BINDING_ID|WORKSPACE_ID|SPACE_ID|KNOWLEDGE_ID|DOCMOST_BASE_URL|DOCMOST_API_KEY|OPEN_WEBUI_API_KEY|REDIS_URL)='; then
            echo 'Per-space RAG credentials leaked into container environment' >&2
            exit 1
          fi

      - name: Capture server logs
        if: always()
        env:
          CI_LOG_CANARIES: "ci-only-app-secret-at-least-32-characters;docmost-ci-password;CI-smoke-password-123!"
        run: |
          mkdir -p ci-artifacts
          capture_log() {
            docker logs "$1" 2>&1 | node scripts/sanitize-ci-log-stream.mjs >"ci-artifacts/$2" || true
          }
          capture_log docmost-app server.log
          capture_log docmost-app-replica server-replica.log
          capture_log docmost-collab collaboration.log
          capture_log docmost-db postgres.log
          capture_log docmost-redis redis.log
          capture_log docmost-open-webui open-webui-mock.log
          node scripts/scan-ci-artifacts.mjs ci-artifacts
          touch ci-artifacts/.sanitized

      - name: Upload server logs on failure
        if: failure() && hashFiles('ci-artifacts/.sanitized') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-logs
          path: ci-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop smoke containers
        if: always()
        run: |
          docker rm -f docmost-app docmost-app-replica docmost-collab docmost-open-webui docmost-db docmost-redis 2>/dev/null || true
          docker network rm docmost-ci 2>/dev/null || true
          docker volume rm docmost-ci-storage 2>/dev/null || true
