services:
  rag-sync:
    build:
      context: .
      dockerfile: Dockerfile.rag-sync
    restart: unless-stopped
    environment:
      RAG_SYNC_CONFIG_PATH: /app/config/rag-sync.json
    volumes:
      - ${RAG_SYNC_CONFIG_PATH:-./rag-sync.config.json}:/app/config/rag-sync.json:ro
    secrets:
      - docmost_rag_api_key
      - open_webui_writer_api_key
    depends_on:
      redis:
        condition: service_started

secrets:
  docmost_rag_api_key:
    file: ${RAG_SYNC_DOCMOST_KEY_FILE:-./secrets/docmost-rag-api-key}
  open_webui_writer_api_key:
    file: ${RAG_SYNC_OPEN_WEBUI_KEY_FILE:-./secrets/open-webui-writer-api-key}
