[Service]
# Override this non-secret path in a later host drop-in when using a flattened release manifest.
Environment=DOCMOST_BACKUP_COMPOSE=/opt/docmost/compose.production.yml
ExecStart=
ExecStart=/opt/docmost/tools/node22 /opt/docmost/backup-tool/scripts/backup-scheduled.mjs --archive /backup/docmost.latest.tar --env-file /etc/docmost/docmost.env --state-file /var/lib/docmost/deployment/postgres.env --compose-file ${DOCMOST_BACKUP_COMPOSE} --yes
TimeoutStopSec=180
