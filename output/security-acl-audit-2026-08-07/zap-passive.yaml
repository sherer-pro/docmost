env:
  contexts:
    - name: docmost-local
      urls:
        - http://host.docker.internal:3000
      includePaths:
        - http://host\.docker\.internal:3000/.*
      excludePaths:
        - https?://(?!host\.docker\.internal:3000).*
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: docmost-local
      url: http://host.docker.internal:3000
      maxDuration: 1
      maxDepth: 3
      maxChildren: 50
      acceptCookies: false
      postForm: false
      processForm: false
      parseRobotsTxt: false
      parseSitemapXml: false
      parseGit: false
      parseDsStore: false
      parseSVNEntries: false
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: /zap/wrk
      reportFile: zap-passive-report.html
      reportTitle: Docmost ACL passive scan
      reportDescription: Passive-only scan constrained to host.docker.internal:3000.
      displayReport: false
    sites:
      - host.docker.internal:3000
  - type: report
    parameters:
      template: traditional-json-plus
      reportDir: /zap/wrk
      reportFile: zap-passive-report.json
      reportTitle: Docmost ACL passive scan
      reportDescription: Passive-only scan constrained to host.docker.internal:3000.
      displayReport: false
    sites:
      - host.docker.internal:3000
