services:
  docmost:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-docmost}:${POSTGRES_PASSWORD:-audit_password}@toxiproxy:15432/${POSTGRES_DB:-docmost}"
      REDIS_URL: "redis://toxiproxy:16379"
      AI_PROVIDER_ALLOWED_ORIGINS: "http://host.docker.internal:${DOCMOST_AI_AGENT_MODEL_PORT:-1180}"
      AI_RETRIEVAL_ALLOWED_ORIGINS: ""
      AI_EXTERNAL_MCP_ENABLED: "false"
      AUTH_RATE_LIMIT_STORAGE: "redis"
      DISABLE_TELEMETRY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  toxiproxy:
    image: "ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e"
    ports:
      - "127.0.0.1:${DOCMOST_AI_AGENT_TOXIPROXY_PORT:-18474}:8474"
    restart: "no"
    networks:
      - default
