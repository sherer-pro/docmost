    <g transform="translate(636 164)">
      <rect width="552" height="126" rx="14" fill="#fff" stroke="#dbe2ea"/>
      <text x="22" y="38" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1e3a5f">check:rag-docs</text>
      <rect x="425" y="19" width="105" height="29" rx="14" fill="#e7f7ef" stroke="#bce8d2"/>
      <text x="441" y="39" font-size="13" font-weight="700" fill="#137a4b">ПРОЙДЕНО</text>
      <text x="22" y="84" font-size="17" fill="#425168">15 маршрутов — контракт актуален</text>
    </g>
    <g transform="translate(66 308)">
      <rect width="552" height="126" rx="14" fill="#fff" stroke="#dbe2ea"/>
      <text x="22" y="38" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1e3a5f">check:no-ee</text>
      <rect x="425" y="19" width="105" height="29" rx="14" fill="#e7f7ef" stroke="#bce8d2"/>
      <text x="441" y="39" font-size="13" font-weight="700" fill="#137a4b">ПРОЙДЕНО</text>
      <text x="22" y="84" font-size="17" fill="#425168">Компоненты Enterprise Edition отсутствуют</text>
    </g>
    <g transform="translate(636 308)">
      <rect width="552" height="126" rx="14" fill="#fff" stroke="#dbe2ea"/>
      <text x="22" y="38" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1e3a5f">check:comments:en</text>
      <rect x="425" y="19" width="105" height="29" rx="14" fill="#e7f7ef" stroke="#bce8d2"/>
      <text x="441" y="39" font-size="13" font-weight="700" fill="#137a4b">ПРОЙДЕНО</text>
      <text x="22" y="84" font-size="17" fill="#425168">Проверка языка документации пройдена</text>
