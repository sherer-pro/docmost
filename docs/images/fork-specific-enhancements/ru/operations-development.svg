<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Проверки эксплуатационной готовности</title>
  <desc id="desc">Пройденные проверки документации репозитория и доступные команды проверки и восстановления.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#334155" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="66" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#152033">Эксплуатационная готовность</text>
  <text x="66" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5b687a">Проверки документации и репозитория</text>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(66 164)">
